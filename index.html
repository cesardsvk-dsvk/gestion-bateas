<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de bateas</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f7;
  color:#17212b;
}

header{
  background:#17466b;
  color:white;
  padding:18px 22px;
  font-size:25px;
  font-weight:bold;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1,h2,h3{
  margin-top:0;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-size:16px;
  cursor:pointer;
  background:#1976b9;
  color:white;
}

button:hover{
  opacity:.9;
}

button.secondary{
  background:#64748b;
}

button.danger{
  background:#c62828;
}

button.small{
  padding:7px 10px;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:130px;
  resize:vertical;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  align-items:end;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.search{
  margin-bottom:18px;
}

.polygon-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:16px;
}

.polygon-card,
.batea-card{
  border:2px solid #d6e0e8;
  border-radius:14px;
  padding:18px;
  background:white;
  cursor:pointer;
}

.polygon-card:hover,
.batea-card:hover{
  border-color:#1976b9;
  transform:translateY(-1px);
}

.folder{
  font-size:30px;
  margin-bottom:8px;
}

.muted{
  color:#64748b;
}

.back{
  margin-bottom:15px;
}

.batea-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.color-palette{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.color-option{
  width:34px;
  height:34px;
  border-radius:7px;
  border:3px solid white;
  box-shadow:0 0 0 1px #9ca3af;
  cursor:pointer;
}

.color-option.selected{
  box-shadow:0 0 0 3px #111827;
}

.custom-color{
  display:flex;
  align-items:center;
  gap:8px;
}

.custom-color input{
  width:50px;
  height:38px;
  padding:2px;
}

.grid-wrap{
  overflow:auto;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  padding:10px;
}

.batea-map{
  display:grid;
  gap:2px;
  min-width:500px;
  background:#475569;
  border:2px solid #334155;
}

.map-cell{
  background:#f8fafc;
  border:1px solid #64748b;
  min-height:38px;
  cursor:pointer;
  position:relative;
}

.map-cell:hover{
  outline:3px solid rgba(25,118,185,.35);
  z-index:2;
}

.map-cell.selected-cell{
  outline:3px solid #111827;
  z-index:3;
}

.info-table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

.table-wrap{
  overflow:auto;
}

.info-table th,
.info-table td{
  border:1px solid #cbd5e1;
  padding:8px;
  vertical-align:middle;
}

.info-table th{
  background:#e2e8f0;
  text-align:left;
}

.info-table input{
  min-width:100px;
}

.color-cell{
  width:40px;
  height:32px;
  border-radius:6px;
  border:1px solid #64748b;
  cursor:pointer;
}

.total-box{
  background:#e8f4fc;
  border:2px solid #9ecce9;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.total-main{
  font-size:25px;
  font-weight:bold;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.summary-item{
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:12px;
  background:#f8fafc;
}

.summary-color{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:bold;
}

.summary-swatch{
  width:24px;
  height:24px;
  border-radius:5px;
  border:1px solid #64748b;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:30px;
}

.notice{
  padding:12px;
  border-radius:8px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  margin-bottom:15px;
}

@media(max-width:700px){
  header{
    font-size:21px;
    padding:15px;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:14px;
  }

  button{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>Gestión de bateas</header>

<div class="container" id="app"></div>

<script>

const STORAGE_KEY = "gestionBateas_v4";

const DEFAULT_POLYGONS = [
  "Cangas a",
  "Cangas b",
  "Cangas f",
  "Bueu a1",
  "Redondela d"
];

const COLORS = [
  "#e53935",
  "#ef5350",
  "#ff7043",
  "#ff9800",
  "#ffb300",
  "#fdd835",
  "#c0ca33",
  "#7cb342",
  "#43a047",
  "#00897b",
  "#00acc1",
  "#039be5",
  "#1e88e5",
  "#3949ab",
  "#5e35b1",
  "#8e24aa",
  "#d81b60",
  "#6d4c41",
  "#757575",
  "#263238",
  "#90caf9",
  "#a5d6a7",
  "#ffe082",
  "#ce93d8"
];

let data = loadData();

let currentView = {
  type:"polygons",
  polygonId:null,
  bateaId:null
};

let selectedPaintColor = COLORS[11];

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).substring(2,8);
}

function createBatea(name){
  return {
    id:uid(),
    name:name || "Nueva batea",
    rows:10,
    cols:7,
    cells:{},
    records:[],
    notes:""
  };
}

function createPolygon(name){
  return {
    id:uid(),
    name:name,
    bateas:[]
  };
}

function loadData(){

  try{
    const saved=localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed=JSON.parse(saved);

      if(parsed && Array.isArray(parsed.polygons)){
        return parsed;
      }
    }
  }catch(e){
    console.error(e);
  }

  return {
    polygons:DEFAULT_POLYGONS.map(name=>createPolygon(name))
  };
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function getPolygon(id){
  return data.polygons.find(p=>p.id===id);
}

function getBatea(polygon,id){
  return polygon?.bateas.find(b=>b.id===id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatNumber(n){
  return Number(n||0).toLocaleString("es-ES");
}

function render(){

  if(currentView.type==="polygons"){
    renderPolygons();
    return;
  }

  if(currentView.type==="batea"){
    renderBatea();
    return;
  }

  if(currentView.type==="polygon"){
    renderPolygon();
  }
}


/* =========================================================
   POLIGONOS
========================================================= */

function renderPolygons(){

  currentView.type="polygons";

  document.getElementById("app").innerHTML=`

    <div class="card">

      <div class="section-title">

        <div>
          <h1>Polígonos de producción</h1>
          <div class="muted">
            Cada polígono contiene sus propias bateas.
          </div>
        </div>

        <button onclick="newPolygon()">
          + Nuevo polígono
        </button>

      </div>

    </div>

    <div class="card search">
      <input
        id="polygonSearch"
        placeholder="Buscar polígono..."
        oninput="filterPolygons()"
      >
    </div>

    <div id="polygonList" class="polygon-grid"></div>
  `;

  filterPolygons();
}

function filterPolygons(){

  const input=document.getElementById("polygonSearch");

  if(!input)return;

  const term=input.value.toLowerCase().trim();

  const list=document.getElementById("polygonList");

  const polygons=data.polygons.filter(p=>
    p.name.toLowerCase().includes(term)
  );

  if(!polygons.length){
    list.innerHTML=`
      <div class="card empty">
        No se encontraron polígonos.
      </div>
    `;
    return;
  }

  list.innerHTML=polygons.map(p=>`

    <div class="polygon-card"
         onclick="openPolygon('${p.id}')">

      <div class="folder">📁</div>

      <h2>${escapeHtml(p.name)}</h2>

      <div class="muted">
        ${p.bateas.length} batea${p.bateas.length===1?"":"s"}
      </div>

      <div style="margin-top:12px;">
        <strong>
          ${formatNumber(polygonTotal(p))} cuerdas
        </strong>
      </div>

    </div>

  `).join("");
}

function newPolygon(){

  const name=prompt("Nombre del nuevo polígono:");

  if(!name || !name.trim())return;

  data.polygons.push(createPolygon(name.trim()));

  saveData();

  renderPolygons();
}

function openPolygon(id){

  currentView={
    type:"polygon",
    polygonId:id
  };

  renderPolygon();
}


/* =========================================================
   POLIGONO
========================================================= */

function renderPolygon(){

  const p=getPolygon(currentView.polygonId);

  if(!p){
    currentView.type="polygons";
    renderPolygons();
    return;
  }

  document.getElementById("app").innerHTML=`

    <div class="back">
      <button class="secondary" onclick="renderPolygons()">
        ← Polígonos
      </button>
    </div>

    <div class="card">

      <div class="section-title">

        <div>
          <h1>📁 ${escapeHtml(p.name)}</h1>
          <div class="muted">
            ${p.bateas.length} batea${p.bateas.length===1?"":"s"}
          </div>
        </div>

        <div class="toolbar">

          <button onclick="newBatea('${p.id}')">
            + Nueva batea
          </button>

          <button
            class="secondary"
            onclick="renamePolygon('${p.id}')">
            Renombrar
          </button>

          <button
            class="danger"
            onclick="deletePolygon('${p.id}')">
            Eliminar
          </button>

        </div>

      </div>

    </div>

    <div class="card">

      <h2>Resumen del polígono</h2>

      <div class="total-box">
        <div class="muted">Total de cuerdas</div>
        <div class="total-main">
          ${formatNumber(polygonTotal(p))}
        </div>
      </div>

      <h3 style="margin-top:20px;">
        Total por color
      </h3>

      <div class="summary-grid">
        ${polygonColorSummaryHtml(p)}
      </div>

    </div>

    <div class="card">

      <div class="section-title">
        <h2>Bateas</h2>
      </div>

      <div class="batea-grid">

        ${
          p.bateas.length
          ?
          p.bateas.map(b=>`

            <div
              class="batea-card"
              onclick="openBatea('${p.id}','${b.id}')">

              <h2>⚓ ${escapeHtml(b.name)}</h2>

              <div class="muted">
                ${b.rows} filas × ${b.cols} columnas
              </div>

              <div style="margin-top:10px;">
                <strong>
                  ${formatNumber(bateaTotal(b))} cuerdas
                </strong>
              </div>

            </div>

          `).join("")
          :
          `
          <div class="empty">
            Este polígono todavía no tiene bateas.
          </div>
          `
        }

      </div>

    </div>
  `;
}

function renamePolygon(id){

  const p=getPolygon(id);

  if(!p)return;

  const name=prompt("Nuevo nombre del polígono:",p.name);

  if(!name || !name.trim())return;

  p.name=name.trim();

  saveData();
  renderPolygon();
}

function deletePolygon(id){

  const p=getPolygon(id);

  if(!p)return;

  if(!confirm(
    `¿Eliminar el polígono "${p.name}" y todas sus bateas?`
  ))return;

  data.polygons=data.polygons.filter(x=>x.id!==id);

  saveData();

  currentView.type="polygons";

  renderPolygons();
}

function newBatea(polygonId){

  const p=getPolygon(polygonId);

  if(!p)return;

  const name=prompt("Nombre de la nueva batea:");

  if(!name || !name.trim())return;

  p.bateas.push(createBatea(name.trim()));

  saveData();

  renderPolygon();
}

function openBatea(polygonId,bateaId){

  currentView={
    type:"batea",
    polygonId,
    bateaId
  };

  renderBatea();
}


/* =========================================================
   BATEA
========================================================= */

function renderBatea(){

  const p=getPolygon(currentView.polygonId);
  const b=getBatea(p,currentView.bateaId);

  if(!p || !b){
    currentView.type="polygons";
    renderPolygons();
    return;
  }

  document.getElementById("app").innerHTML=`

    <div class="back">
      <button
        class="secondary"
        onclick="openPolygon('${p.id}')">
        ← ${escapeHtml(p.name)}
      </button>
    </div>

    <div class="card">

      <div class="section-title">

        <div>
          <h1>⚓ ${escapeHtml(b.name)}</h1>
          <div class="muted">
            Polígono: ${escapeHtml(p.name)}
          </div>
        </div>

        <div class="toolbar">

          <button
            class="secondary"
            onclick="renameBatea('${p.id}','${b.id}')">
            Renombrar batea
          </button>

          <button
            class="danger"
            onclick="deleteBatea('${p.id}','${b.id}')">
            Eliminar batea
          </button>

        </div>

      </div>

    </div>


    <div class="card">

      <h2>Configuración del mapa</h2>

      <div class="form-grid">

        <div>
          <label>Filas</label>
          <input
            id="rowsInput"
            type="number"
            min="1"
            max="100"
            value="${b.rows}">
        </div>

        <div>
          <label>Columnas</label>
          <input
            id="colsInput"
            type="number"
            min="1"
            max="50"
            value="${b.cols}">
        </div>

        <div>
          <button onclick="resizeGrid('${p.id}','${b.id}')">
            Aplicar tamaño
          </button>
        </div>

      </div>

      <div class="notice" style="margin-top:15px;">
        Tamaño estándar de columnas:
        <strong>
          0,75 / 0,5 / 1,3 / 0,5 / 1,3 / 0,5 / 0,75
        </strong>
      </div>

    </div>


    <div class="card">

      <h2>Mapa de la batea</h2>

      <div>
        <strong>Color seleccionado para pintar:</strong>
        <span
          id="selectedColorLabel"
          style="
            display:inline-block;
            width:28px;
            height:28px;
            background:${selectedPaintColor};
            vertical-align:middle;
            margin-left:8px;
            border-radius:5px;
            border:1px solid #555;
          ">
        </span>
      </div>

      <div class="color-palette">

        ${COLORS.map(c=>`

          <div
            class="color-option ${c===selectedPaintColor?"selected":""}"
            style="background:${c}"
            onclick="selectPaintColor('${c}')">
          </div>

        `).join("")}

        <div class="custom-color">
          <span>Otro:</span>
          <input
            type="color"
            value="${selectedPaintColor}"
            onchange="selectPaintColor(this.value)">
        </div>

      </div>

      <p class="muted">
        Selecciona un color y toca las celdas que quieras pintar.
        No es necesario introducir procedencia.
      </p>

      <div class="grid-wrap">
        ${mapHtml(b)}
      </div>

    </div>


    <div class="card">

      <div class="section-title">

        <div>
          <h2>Información de plantado</h2>

          <div class="muted">
            Puedes asociar cada registro a un color.
          </div>
        </div>

        <button
          onclick="addRecord('${p.id}','${b.id}')">
          + Añadir registro
        </button>

      </div>

      <div class="table-wrap">

        <table class="info-table">

          <thead>
            <tr>
              <th>Color</th>
              <th>Fecha de plantado</th>
              <th>Procedencia / referencia</th>
              <th>Tamaño / característica</th>
              <th>Nº cuerdas</th>
              <th></th>
            </tr>
          </thead>

          <tbody>

            ${
              b.records.length
              ?
              b.records.map((r,i)=>recordRowHtml(p,b,r,i)).join("")
              :
              `
              <tr>
                <td colspan="6" class="empty">
                  No hay registros todavía.
                </td>
              </tr>
              `
            }

          </tbody>

        </table>

      </div>

      <div class="total-box">

        <div class="muted">
          Total de cuerdas de esta batea
        </div>

        <div class="total-main">
          ${formatNumber(bateaTotal(b))}
        </div>

      </div>

      <h3 style="margin-top:20px;">
        Total de cuerdas por color
      </h3>

      <div class="summary-grid">
        ${bateaColorSummaryHtml(b)}
      </div>

    </div>


    <div class="card">

      <h2>Anotaciones</h2>

      <textarea
        id="notes"
        placeholder="Escribe aquí cualquier anotación de la batea..."
        onchange="saveNotes('${p.id}','${b.id}',this.value)"
      >${escapeHtml(b.notes)}</textarea>

    </div>

  `;
}

function mapHtml(b){

  let columns;

  if(b.cols===7){
    columns=".75fr .5fr 1.3fr .5fr 1.3fr .5fr .75fr";
  }else{
    columns=`repeat(${b.cols},1fr)`;
  }

  let html=`
    <div
      class="batea-map"
      style="
        grid-template-columns:${columns};
        grid-template-rows:repeat(${b.rows},minmax(38px,1fr));
      ">
  `;

  for(let r=1;r<=b.rows;r++){

    for(let c=1;c<=b.cols;c++){

      const key=`${r}-${c}`;

      const color=b.cells[key] || "#f8fafc";

      html+=`
        <div
          class="map-cell"
          style="background:${color}"
          onclick="paintCell(
            '${currentView.polygonId}',
            '${b.id}',
            '${key}'
          )">
        </div>
      `;
    }
  }

  html+="</div>";

  return html;
}

function selectPaintColor(color){

  selectedPaintColor=color;

  renderBatea();
}

function paintCell(polygonId,bateaId,key){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  if(b.cells[key]===selectedPaintColor){
    delete b.cells[key];
  }else{
    b.cells[key]=selectedPaintColor;
  }

  saveData();

  renderBatea();
}

function resizeGrid(polygonId,bateaId){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  const rows=parseInt(document.getElementById("rowsInput").value);
  const cols=parseInt(document.getElementById("colsInput").value);

  if(!rows || rows<1 || !cols || cols<1){
    alert("Introduce un número válido de filas y columnas.");
    return;
  }

  const oldCells={...b.cells};
  const newCells={};

  Object.keys(oldCells).forEach(key=>{

    const [r,c]=key.split("-").map(Number);

    if(r<=rows && c<=cols){
      newCells[key]=oldCells[key];
    }

  });

  b.rows=rows;
  b.cols=cols;
  b.cells=newCells;

  saveData();

  renderBatea();
}

function renameBatea(polygonId,bateaId){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  const name=prompt(
    "Nuevo nombre de la batea:",
    b.name
  );

  if(!name || !name.trim())return;

  b.name=name.trim();

  saveData();

  renderBatea();
}

function deleteBatea(polygonId,bateaId){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!p || !b)return;

  if(!confirm(
    `¿Eliminar la batea "${b.name}"?`
  ))return;

  p.bateas=p.bateas.filter(x=>x.id!==bateaId);

  saveData();

  openPolygon(polygonId);
}

function saveNotes(polygonId,bateaId,value){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  b.notes=value;

  saveData();
}


/* =========================================================
   REGISTROS
========================================================= */

function addRecord(polygonId,bateaId){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  b.records.push({
    id:uid(),
    color:selectedPaintColor,
    date:"",
    origin:"",
    characteristic:"",
    ropes:0
  });

  saveData();

  renderBatea();
}

function recordRowHtml(p,b,r,i){

  return `
    <tr>

      <td>
        <input
          class="color-cell"
          type="color"
          value="${r.color || selectedPaintColor}"
          onchange="
            updateRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}',
              'color',
              this.value
            )
          ">
      </td>

      <td>
        <input
          type="date"
          value="${escapeHtml(r.date)}"
          onchange="
            updateRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}',
              'date',
              this.value
            )
          ">
      </td>

      <td>
        <input
          type="text"
          placeholder="Procedencia o referencia"
          value="${escapeHtml(r.origin)}"
          onchange="
            updateRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}',
              'origin',
              this.value
            )
          ">
      </td>

      <td>
        <input
          type="text"
          placeholder="Tamaño, clase, etc."
          value="${escapeHtml(r.characteristic)}"
          onchange="
            updateRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}',
              'characteristic',
              this.value
            )
          ">
      </td>

      <td>
        <input
          type="number"
          min="0"
          value="${Number(r.ropes||0)}"
          onchange="
            updateRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}',
              'ropes',
              this.value
            )
          ">
      </td>

      <td>
        <button
          class="danger small"
          onclick="
            deleteRecord(
              '${p.id}',
              '${b.id}',
              '${r.id}'
            )
          ">
          Eliminar
        </button>
      </td>

    </tr>
  `;
}

function updateRecord(
  polygonId,
  bateaId,
  recordId,
  field,
  value
){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  const r=b.records.find(x=>x.id===recordId);

  if(!r)return;

  if(field==="ropes"){
    r.ropes=Math.max(0,Number(value)||0);
  }else{
    r[field]=value;
  }

  saveData();

  renderBatea();
}

function deleteRecord(polygonId,bateaId,recordId){

  const p=getPolygon(polygonId);
  const b=getBatea(p,bateaId);

  if(!b)return;

  b.records=b.records.filter(r=>r.id!==recordId);

  saveData();

  renderBatea();
}


/* =========================================================
   SUMAS
========================================================= */

function bateaTotal(b){

  return b.records.reduce(
    (sum,r)=>sum+(Number(r.ropes)||0),
    0
  );
}

function polygonTotal(p){

  return p.bateas.reduce(
    (sum,b)=>sum+bateaTotal(b),
    0
  );
}

function colorTotalsForBatea(b){

  const totals={};

  b.records.forEach(r=>{

    const color=r.color || "#999999";

    totals[color]=(totals[color]||0)+(Number(r.ropes)||0);

  });

  return totals;
}

function colorTotalsForPolygon(p){

  const totals={};

  p.bateas.forEach(b=>{

    b.records.forEach(r=>{

      const color=r.color || "#999999";

      totals[color]=(totals[color]||0)+(Number(r.ropes)||0);

    });

  });

  return totals;
}

function bateaColorSummaryHtml(b){

  const totals=colorTotalsForBatea(b);

  const entries=Object.entries(totals)
    .filter(([color,total])=>total>0);

  if(!entries.length){
    return `
      <div class="empty">
        Todavía no hay cuerdas registradas.
      </div>
    `;
  }

  return entries.map(([color,total])=>`

    <div class="summary-item">

      <div class="summary-color">

        <span
          class="summary-swatch"
          style="background:${color}">
        </span>

        <span>
          ${formatNumber(total)} cuerdas
        </span>

      </div>

    </div>

  `).join("");
}

function polygonColorSummaryHtml(p){

  const totals=colorTotalsForPolygon(p);

  const entries=Object.entries(totals)
    .filter(([color,total])=>total>0);

  if(!entries.length){
    return `
      <div class="empty">
        Todavía no hay cuerdas registradas.
      </div>
    `;
  }

  return entries.map(([color,total])=>`

    <div class="summary-item">

      <div class="summary-color">

        <span
          class="summary-swatch"
          style="background:${color}">
        </span>

        <span>
          ${formatNumber(total)} cuerdas
        </span>

      </div>

    </div>

  `).join("");
}


/* =========================================================
   INICIO

render();
